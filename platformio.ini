; ColonyAFIS onboard software - PlatformIO project
;   megapi  : the real robot (MegaPi board = ATmega2560)
;   hw_*    : desk-test programs, one per part, for the real MegaPi (src/hwtest/<part>.cpp)
;   test    : unit tests that run on your PC (MSYS2 gcc, D:\Tools\msys64\ucrt64\bin on PATH)

[platformio]
default_envs = megapi

[env:megapi]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; The MegaPi's USB port on Munad's PC (CH340). COM3 is the PC's Intel port, never the board.
; If the board moves to another USB socket and gets a new number, change it here.
upload_port = COM8
monitor_port = COM8
; Every monitor session is also saved to logs/device-monitor-<date>-<time>.log (git-ignored).
; Desk logs worth keeping get copied to tests/results/.
monitor_filters = log2file
build_flags = -Wall
; The robot firmware never includes the desk-test programs.
build_src_filter = +<*> -<hwtest/>
; The Makeblock library is added at the HAL step.

; ---------- Desk tests (plan, "Desk tests on the real MegaPi") ----------
; Each builds only its own program from src/hwtest/ (plus headers from src/core/), never main.cpp.

; Desk test 1: Serial + Bluetooth.  pio run -e hw_link -t upload, then pio device monitor -e hw_link
[env:hw_link]
extends = env:megapi
build_src_filter = -<*> +<hwtest/link.cpp>

; Desk test 4: side ultrasonic (port 6).  pio run -e hw_ultrasonic -t upload, then Monitor
[env:hw_ultrasonic]
extends = env:megapi
build_src_filter = -<*> +<hwtest/ultrasonic.cpp> +<hwtest/desk_io.cpp>

; Desk test 6: colour sensor (port 8, I2C).  pio run -e hw_color -t upload, then Monitor
[env:hw_color]
extends = env:megapi
build_src_filter = -<*> +<hwtest/color.cpp> +<hwtest/desk_io.cpp>

[env:test]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Wall -Isrc
