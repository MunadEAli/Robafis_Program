; ColonyAFIS onboard software - PlatformIO project
;   megapi : the real robot (MegaPi board = ATmega2560)
;   test   : unit tests that run on your PC (MSYS2 gcc, D:\Tools\msys64\ucrt64\bin on PATH)

[platformio]
default_envs = megapi

[env:megapi]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -Wall
; The Makeblock library is added at the HAL step.

[env:test]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Wall -Isrc
